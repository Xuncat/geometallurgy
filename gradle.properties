org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 注意：不要在这里写 org.gradle.java.home / org.gradle.java.installations.paths。
# 那会把本机 JDK 路径写死进仓库，别人 clone 后构建直接失败。
# JDK 25 由 build.gradle 里的 java.toolchain 自动选择；
# 若本机需要固定 JDK，请写入用户级 ~/.gradle/gradle.properties（不进仓库）。

# Fabric 工具链 (https://fabricmc.net/develop)
minecraft_version=26.4-snapshot-3
loader_version=0.19.5
loom_version=1.18.3
fabric_api_version=0.162.2+26.4
# Team Reborn Energy：Fabric 生态的能量 API（5.x = Minecraft 26.1+）
energy_version=5.0.0

# 模组信息
# 发布标签应与此值完全一致（tag 去掉前导 v）。beta 用 -beta.N，见 docs 里的版本规范。
mod_version=1.0.0-beta.1
maven_group=com.geometallurgy
archives_base_name=geometallurgy
